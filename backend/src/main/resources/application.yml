server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: customer-visit
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:customer_visit}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  jwt:
    # 生产环境务必通过环境变量覆盖（至少 32 字节）
    secret: ${JWT_SECRET:customer-visit-default-secret-key-please-change-32bytes}
    expire-hours: ${JWT_EXPIRE_HOURS:168}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  default-password: ${DEFAULT_MANAGER_PASSWORD:123456}

logging:
  level:
    root: info
    com.example.visit: info
